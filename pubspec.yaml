name: inverter_app
description: A modern desktop application for monitoring and controlling PowMr / SmartESS solar inverters.
publish_to: 'none'
version: 2.0.10+11
# Repository and homepage
repository: https://github.com/denilnicolosi/siseli-app
homepage: https://github.com/denilnicolosi/siseli-app

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  system_tray: ^2.0.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  launch_at_startup: ^0.5.1

  intl: any
  fl_chart: 0.70.2
  window_manager: ^0.5.1
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  open_file: ^3.3.2
  local_notifier: ^0.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  msix: ^3.16.7
dependency_overrides:
  path_provider_android: 2.2.15
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256

msix_config:
  display_name: Smart Inverter App
  publisher_display_name: Denil Nicolosi
  identity_name: DenilNicolosi.SmartInverterApp
  msix_version: 2.0.10.11
  logo_path: assets/app_icon.png
  capabilities: internetClient, privateNetworkClientServer
  install_certificate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Exo 2
      fonts:
        - asset: assets/fonts/Exo2-Variable.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
